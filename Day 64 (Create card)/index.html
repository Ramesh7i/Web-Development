<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card{
            display: flex;
            border: 2px solid black;
            width: 700px;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .image img{
            width: 200px;
        }

        .text h1,p{
            padding: 2px 0;
        }
        .image{
            position: relative;
        }

        .image .capsule{
            position: absolute;
            bottom: 4px;
            color: white;
            background-color: rgb(155, 153, 153);
            z-index: 10;
            right: 5px;
            opacity: 0.9;
            padding: 2px;
            margin: 5px;
            border-radius:2px;
            font-size: 14px;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="image">
                <img src="pic.jpg" alt="Pic">
                <div class="capsule">29:08</div>
            </div>
            <div class="text">
                <h1>POV: You Cracked Your Neck a Little Too Hard 💀😭</h1>
                <p>HeyitsSunny . 10M views . 9 months ago</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
