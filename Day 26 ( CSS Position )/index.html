<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position </title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            height: 433px;
            width: 80vw;
            padding: 3px;
            margin: 3px;
            border: 2px solid black;
        }

        .box1{
            background-color: aqua;
            /* element ko normal flow se hata kar precisely position karta hai. */
            position: absolute;

            /*  scroll karte waqt element ko chipka deta hai. */
            /* position: sticky;
            top:0px;
            height: 111px;
            margin: 0;
            padding: 0; */
        }
        .box2{
            background-color: antiquewhite;
            /* element ko uski normal position ke relative move karne deta hai. */
            /* position: relative;
            top: 34px;
            left: 56px; */
        }
        .box3{
            background-color: darkcyan;
            /* element screen par chipka rehta hai. */
            /* position: fixed;
            bottom: 0;
            left: 8vh;
            height: 111px; */
        }
        .box4{
            background-color: blue;
        }

        .parent{
            padding: 3px;
            margin: 34px;
            border: 2px solid blue;
            /* position: absolute; */
            /* position: relative; */
            /* position: sticky; */

            /* element ko apni jagah se move nahi karta. */
            transform: translate(0);

            /* colors ko bilkul invert nahi karta. */
            filter: invert(0);

             /* 3D depth ko zero rakhta hai, isliye koi effect nahi dikhta. */
            perspective: 0em;
        }

    </style>
</head>
<body>
    <div class="parent">
        
        <div class="box box1">box1</div>
        <div class="box box2">box2</div>
        <div class="box box3">box3</div>
        <div class="box box4">box4</div>

    </div>
</body>
</html>
