<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Again Card Making</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            background-color: gray;
            padding: 45px;
            display: flex;
        }

        .card{
            background-color: white;
            width: 198px;
            height: 400px;
            border-radius: 7px;
            padding: 0 0 10px 0;
            margin: 4px;
        }

        .image{
            padding: 5px;

        }

        .image img{
            border-radius: 7px;
        }

        .content{
            padding: 7px 13px;
        }

        .content p{
            font-size: 13px;
            color: gray;
        }

        .capsules{
            padding: 0 28px 0 14px;
        }

        .capsules span{
            border: 1px solid gray;
            padding: 0px 6px;
            border-radius: 7px;
            font-size: 12px;
        }

        .button{
            text-align: center;
        }

        .button button{
            padding: 7px 9px;
            border-radius: 15px;
            background-color: lightblue;
            color: blue;
            font-size: 12px;
            margin-top: 7px;
            border: none;
            cursor: pointer;
        }

        .button button:hover{
            background-color: rgb(80, 211, 255);
            color: rgb(49, 49, 139);
        }
    </style>
</head>
<body>
    <div class="card">

        <div class="image">
            <img width="188px" src="memes.png" alt="Billi Don">
        </div>

        <div class="capsules">
            <span>Nature</span>
            <span>Lake</span>
        </div>
        <div class="content">
            <h2>Whatever</h2>
            <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Vel, modi sit! Molestias dolores suscipit culpa incidunt provident fuga numquam aut debitis ad. Hic commodi aperiam qui harum dolorem iure adipisci totam ipsa delectus sunt!</p>
        </div>

        <div class="button">
            <button>Read more..</button>
        </div>

    </div>
</body>
</html>
