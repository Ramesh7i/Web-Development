<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS multi color Website</title>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fleur+De+Leah&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Oswald:wght@200..700&family=Playwrite+BR+Guides&family=Tangerine:wght@400;700&family=Varela&family=Yellowtail&display=swap");
    </style>

    <style>

        :root{
            --primary-color: rgb(252, 0, 252);
            --text-color:white;
            --sec-color: rgb(255, 57, 90);
        }

         :root{
            --primary-color: rgb(14, 86, 168);
            --text-color:white;
            --sec-color: rgb(57, 159, 255);
        }

        body{
            background-color: var(--sec-color);
        }
      * {
        margin: 0;
        padding: 0;
          font-family: "Oswald", sans-serif;
      }

      nav {
        /* background-color: purple; */
        background-color: var(--primary-color);
        padding: 12px 0;
      }

      ul li {
        list-style: none;
        display: inline;
        padding: 23px;
        /* color: white; */
        color: var(--text-color);
        font-weight: bold;
      }

      ul li a{
        color: var(--text-color);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <li><a href="/">Home</a></li>
          <li><a href="/">About</a></li>
          <li><a href="/">Contect</a></li>
          <li><a href="/">Services</a></li>
        </ul>
      </nav>
    </header>
  </body>
</html>


<!-- :root mein colors variables banaye.
Doosre :root ki wajah se pehle colors replace ho gaye.
body ka background secondary blue hai.
nav ka background primary blue hai.
Links white, bold aur horizontal hain.
Google se Oswald font import kiya.
padding se navbar aur links mein spacing di. -->
