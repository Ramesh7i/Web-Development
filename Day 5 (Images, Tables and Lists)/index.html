<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- image tag -->
    <img src="image.png" alt="Demon Slayer Character">

    <img width="230" height="120" src="image.png" alt="Demon Slayer Character">

    <br>

    <!-- table tag -->

    <table>
        <caption>Student details</caption>
    <thead>
        <tr>
            <th>Name</th>
            <th>City</th>
            <th>Fav lang.</th>
        </tr>
    </thead> 
    
    <tbody>
        <tr>
            <td>Sidharth</td>
            <td>Jalandhar</td>
            <td>Python</td>
        </tr>
        <tr>
            <td colspan="2">Sam</td>
            <td rowspan="2">Amritsar</td>
            <td>C#</td>
        </tr>
        <tr>
            <td colspan="2">Ram</td>
            <td>C++</td>
    </tbody>

    <tfoot>
        <p>Table footer</p>
    </tfoot>
        </tr>
    </table>


    <!-- HTML lists tag -->

    <!-- unorderd lists -->

    <ul>
        <li>Sid</li>
        <li>Sunny</li>
        <li>Ram</li>
    </ul>

    <ul type="circle">
        <li>Sid</li>
        <li>Sunny</li>
        <li>Ram</li>
    </ul>

    <ul type="square">
        <li>Sid</li>
        <li>Sunny</li>
        <li>Ram</li>
    </ul>

    <!-- Ordered lists -->

     <ol>
        <li>Sid</li>
        <li>Sunny</li>
        <li>Ram</li>
     </ol>

     <ol type="A">
        <li>Sid</li>
        <li>Sunny</li>
        <li>Ram</li>
     </ol>

     <ol type="I">
        <li>Sid</li>
        <li>Sunny</li>
        <li>Ram</li>
     </ol>

</body>
</html>
