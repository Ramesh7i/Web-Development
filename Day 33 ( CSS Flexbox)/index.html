<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Flex box</title>
    <style>
      .container {
        /* display: flex; container ko flexbox banata hai.
        height: 80vh; height screen ki 80% rakhta hai.
        justify-content: center; items ko horizontally center karta hai.
        align-items: center; items ko vertically center karta hai. */
        
        border: 2px solid red;
        display: flex;
        height: 80vh;
        justify-content: center;
        align-items: center;
        
        /* flex-direction: flex items ki direction set karta hai, jaise row ya column. */
        /* flex-direction: column; */
        flex-wrap: wrap;

        /* align-content multiple rows ko container ke andar vertically arrange karta hai. */
        /* align-content: flex-start; */

        /* flex-flow ek shorthand property hai jo flex-direction aur flex-wrap dono set karti hai. */
        flex-flow: row wrap;

        gap: 30px;
      }

      .item {

        /* flex-grow: 1 item ko available extra space mein grow karne deta hai.
        Sabhi items par 1 ho, to space equally divide hoti hai. */
        flex-grow: 1;
        height: 92px;
        width: 92px;
        border: 2px solid black;
        background-color: violet;
        /* margin: 4px; */

      }

      .order-1{
        order: 1;
      }

      .order-2{
        order: 2;
      }

    .item1{
        /* flex-grow: 2; */
        /* flex-shrink: 2; */
        align-self: flex-end;
    }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="item item1">1</div>
      <div class="item">2</div>
      <div class="item">3</div>
      <div class="item order-1">4</div>
      <div class="item">5</div>
      <div class="item order-1">6</div>
      <div class="item">7</div>
      <div class="item">8</div>
    </div>
  </body>
</html>
