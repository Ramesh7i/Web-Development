<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Media Queries</title>
    <style>
        body{
            background-color: red;
        }

        /* @media (condition) {
    /* responsive CSS rules } */

    /* Landscape orientation mein body par purple border lagega. */
    @media  screen and (orientation: landscape) {
        body{
            border: 2px solid purple;
        }
        
    }

    /* 445px se chhoti screen par background blue aur boxes vertical honge. */
        @media only screen and (max-width: 445px) {
    body {
        background-color: blue;
    }

    .boxes{
        flex-direction: column;
    }
}

    .boxes{
        display: flex ;
    }

    .box{
        width: 344px;
        height: 344px;
        background-color: steelblue;
        padding: 3px;
        margin: 3px;
    }
    </style>
</head>
<body>
    <div>
        Hey i am red color
    </div>

    <div class="boxes">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>
