<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        .child{
            background-color:aliceblue ;
            border: 2px solid black;
            padding: 14px;
            margin: 14px;
            cursor: pointer;
        }
        
        .childContainer{
            background-color: yellow;
            padding: 14px;
            margin: 14px;
        }

        .container{
            background-color: aqua;
            padding: 14px;
            margin: 14px;
        }
    </style>
  </head>
  <body>
    <div class="container">
      <section class="childContainer">
        <div class="child">I am a Child</div>
      </section>
    </div>
    <script>
      document.querySelector(".child").addEventListener("click", (e) => {
        e.stopPropagation()
        alert("Chid was clicked")
      })

      document.querySelector(".childContainer").addEventListener("click", (e) => {
        e.stopPropagation()
        alert("Chid container was clicked")
      })

      document.querySelector(".container").addEventListener("click", (e) => {
        e.stopPropagation()
        alert("Container was clicked")
      })


    //  let a = setInterval(()=>{
    //     document.querySelector(".childContainer").style.background = "pink";
    //   },1000);

    //   console.log(a)

    let a = setTimeout(()=>{
        document.querySelector(".childContainer").style.background = "pink";
      },1000);

      console.log(a)

    </script>
  </body>
</html>
