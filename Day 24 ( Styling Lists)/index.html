<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styling Lists css</title>
    <style>
        nav ul li{
            /* list-style is a shorthand property for styling list markers, such as their type and position. */
            list-style: upper-roman;

            list-style-type: "😎";
           
            background-color: pink;
           
            /* list-style-position controls whether list markers appear inside or outside the list item. */
            list-style-position: inside;
           
            border: 2px solid black;

            /* sets a custom image marker. */
            /* list-style-image: url(https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExd295dmxvcWpveXAxYmxibDdqcXMxam00aDlheXBhOTQxZHkzNmU3MSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/ACeIDlMpgc4yOf1Lyt/giphy.gif); */

            list-style-image: disc inside url(https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExd295dmxvcWpveXAxYmxibDdqcXMxam00aDlheXBhOTQxZHkzNmU3MSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/ACeIDlMpgc4yOf1Lyt/giphy.gif);
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contect</li>
        </ul>
    </nav>
</body>
</html>
